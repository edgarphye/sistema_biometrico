# Configuración de PHP para Sistema Biométrico - Windows

[PHP]
; Configuración básica
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
unserialize_callback_func =
serialize_precision = -1
disable_functions = exec,passthru,shell_exec,system,proc_open,popen
disable_classes =
zend.enable_gc = On
zend.exception_ignore_args = On
zend.exception_arg_force_str = 1

; Configuración de recursos
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Manejo de errores
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On

; Configuración de uploads y POST
post_max_size = 20M
auto_prepend_file =
auto_append_file =
default_mimetype = "text/html"
default_charset = "UTF-8"
file_uploads = On
upload_tmp_dir = "C:\tools\nginx\html\sistema_biometrico\uploads\temp"
upload_max_filesize = 20M
max_file_uploads = 20

; Configuración de sesiones
session.save_handler = user
session.save_path = "C:\tools\nginx\tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 1
session.name = PHPSESSID
session.auto_start = 0
session.cookie_lifetime = 0
session.cookie_path = /
session.cookie_domain =
session.cookie_httponly = On
session.cookie_samesite = "Lax"
session.serialize_handler = php
session.gc_probability = 0
session.gc_divisor = 1000
session.gc_maxlifetime = 1440
session.referer_check =
session.cache_limiter = nocache
session.cache_expire = 180
session.use_trans_sid = 0
session.sid_length = 26
session.trans_sid_tags = "a=href,area=href,frame=src,form="
session.sid_bits_per_character = 5

; Configuración de base de datos
pdo_mysql.default_socket=
pdo_mysql.default_host=
pdo_mysql.default_user=
pdo_mysql.default_pw=
pdo_mysql.default_db=

; Configuración de seguridad
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60
cli_server.color = On

; Configuración de directorios
doc_root =
user_dir =
extension_dir = "ext"
enable_dl = Off

; Configuración de fileinfo
fileinfo.enable = On

; Extensiones requeridas para Sistema Biométrico
extension=pdo_mysql
extension=gd
extension=curl
extension=mbstring
extension=openssl
extension=fileinfo
extension=json
extension=session

; Configuración de GD
[gd]
; Descomentar una de las siguientes líneas
extension=gd

[Date]
; Configuración de timezone para México
date.timezone = "America/Mexico_City"
date.default_latitude = 19.4326077
date.default_longitude = -99.13320799999999
date.sunrise_zenith = 90.833333
date.sunset_zenith = 90.833333

; Configuración para desarrollo
[mysqlnd]
mysqlnd.collect_statistics = On
mysqlnd.collect_memory_statistics = Off

; Configuración de SSL
[openssl]
openssl.cafile = "C:\tools\nginx\ssl\cacert.pem"
openssl.capath = "C:\tools\nginx\ssl\certs"

; Configuración específica para Sistema Biométrico
[SistemaBiometrico]
; Límites para operaciones biométricas
biometric.max_execution_time = 300
biometric.memory_limit = 512M
biometric.upload_max_filesize = 20M
biometric.max_file_uploads = 10

; Configuración de logging
error_log = "C:\tools\nginx\html\sistema_biometrico\logs\php_errors.log"
syslog.ident = php-sistema-biometrico

; Configuración de curl para conexiones biométricas
[curl]
curl.cainfo = "C:\tools\nginx\ssl\cacert.pem"