# Alerting Rules for Sistema Biométrico
# Prometheus Alert Rules Configuration

groups:
  - name: sistema_biometrico.rules
    rules:
      # System Health Alerts
      - alert: InstanceDown
        expr: up{job="sistema-biometrico"} == 0
        for: 1m
        labels:
          severity: critical
          service: sistema-biometrico
        annotations:
          summary: "Sistema Biométrico está caído"
          description: "La instancia {{ $labels.instance }} ha estado caída por más de 1 minuto"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Uso de memoria elevado"
          description: "El uso de memoria en {{ $labels.instance }} es {{ $value }}%"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Uso de CPU elevado"
          description: "El uso de CPU en {{ $labels.instance }} es {{ $value }}%"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Espacio en disco bajo"
          description: "Espacio disponible en {{ $labels.instance }}:{{ $labels.mountpoint }} es {{ $value }}%"

      # Database Health Alerts
      - alert: MySQLDown
        expr: up{job="mysql-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "MySQL está caído"
          description: "MySQL no está respondiendo en {{ $labels.instance }}"

      - alert: MySQLSlowQueries
        expr: rate(mysql_global_status_slow_queries[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "Consultas lentas en MySQL"
          description: "MySQL está procesando {{ $value }} consultas lentas por segundo"

      - alert: MySQLConnectionsHigh
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "Alto uso de conexiones MySQL"
          description: "MySQL está usando {{ $value }}% de las conexiones máximas"

      # Web Server Alerts
      - alert: NginxDown
        expr: up{job="nginx-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: webserver
        annotations:
          summary: "Nginx está caído"
          description: "Nginx no está respondiendo en {{ $labels.instance }}"

      - alert: NginxHighResponseTime
        expr: histogram_quantile(0.95, rate(nginx_http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
          service: webserver
        annotations:
          summary: "Tiempo de respuesta alto en Nginx"
          description: "El 95% de las peticiones toman más de 2 segundos"

      - alert: NginxHighErrorRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) / rate(nginx_http_requests_total[5m]) * 100 > 5
        for: 2m
        labels:
          severity: warning
          service: webserver
        annotations:
          summary: "Alta tasa de errores HTTP 5xx"
          description: "La tasa de errores 5xx es {{ $value }}%"

      # PHP-FPM Alerts
      - alert: PHPFPMDown
        expr: up{job="php-fpm-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: php
        annotations:
          summary: "PHP-FPM está caído"
          description: "PHP-FPM no está respondiendo en {{ $labels.instance }}"

      - alert: PHPFPMHighProcessCount
        expr: phpfpm_process_count > phpfpm_max_children * 0.8
        for: 5m
        labels:
          severity: warning
          service: php
        annotations:
          summary: "Alto número de procesos PHP-FPM"
          description: "PHP-FPM está usando {{ $value }} procesos (80% del máximo)"

      - alert: PHPFPMHighMemoryUsage
        expr: phpfpm_memory_usage_bytes / phpfpm_max_memory_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: php
        annotations:
          summary: "Alto uso de memoria PHP-FPM"
          description: "PHP-FPM está usando {{ $value }}% de la memoria máxima"

      # Redis Cache Alerts
      - alert: RedisDown
        expr: up{job="redis-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: cache
        annotations:
          summary: "Redis está caído"
          description: "Redis no está respondiendo en {{ $labels.instance }}"

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: cache
        annotations:
          summary: "Alto uso de memoria Redis"
          description: "Redis está usando {{ $value }}% de la memoria máxima"

      - alert: RedisLowHitRate
        expr: redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total) * 100 < 80
        for: 10m
        labels:
          severity: warning
          service: cache
        annotations:
          summary: "Baja tasa de cache hit en Redis"
          description: "La tasa de cache hit de Redis es {{ $value }}%"

      # Application Metrics Alerts
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 3
        for: 3m
        labels:
          severity: warning
          service: application
        annotations:
          summary: "Tiempo de respuesta alto"
          description: "El 95% de las peticiones toman más de 3 segundos"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 2m
        labels:
          severity: warning
          service: application
        annotations:
          summary: "Alta tasa de errores HTTP"
          description: "La tasa de errores HTTP es {{ $value }}%"

      - alert: LowActiveUsers
        expr: active_users_total < 10
        for: 10m
        labels:
          severity: info
          service: application
        annotations:
          summary: "Baja actividad de usuarios"
          description: "Solo {{ $value }} usuarios activos en los últimos 10 minutos"

      # Business Logic Alerts
      - alert: NoEmployeeCheckins
        expr: increase(employee_checkins_total[1h]) == 0
        for: 5m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "Sin registros de entrada de empleados"
          description: "No se han registrado entradas de empleados en la última hora"

      - alert: AnomalousAttendancePattern
        expr: abs(checkins_total - checkins_total_offset_1d) / checkins_total_offset_1d * 100 > 50
        for: 15m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "Patrón de asistencia anómalo"
          description: "El patrón de asistencia ha cambiado más del 50% respecto al día anterior"

      - alert: FailedLoginsHigh
        expr: rate(failed_logins_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Alta tasa de logins fallidos"
          description: "Se están registrando {{ $value }} logins fallidos por minuto"

      - alert: DatabaseConnectionPoolExhausted
        expr: database_connections_active / database_connections_max * 100 > 90
        for: 2m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "Pool de conexiones de base de datos agotado"
          description: "El pool de conexiones está al {{ $value }}% de su capacidad"

      # Custom Business Alerts
      - alert: LowSystemAvailability
        expr: up{job="sistema-biometrico"} * 100 < 99
        for: 5m
        labels:
          severity: critical
          service: application
        annotations:
          summary: "Baja disponibilidad del sistema"
          description: "La disponibilidad del sistema es {{ $value }}%"

      - alert: HighConcurrentUsers
        expr: concurrent_users_total > concurrent_users_max * 0.9
        for: 3m
        labels:
          severity: warning
          service: application
        annotations:
          summary: "Alto número de usuarios concurrentes"
          description: "Número de usuarios concurrentes: {{ $value }} (90% del máximo)"

      # Security Alerts
      - alert: SuspiciousActivityDetected
        expr: rate(security_events_total{level="high"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: security
        annotations:
          summary: "Actividad sospechosa detectada"
          description: "Se han detectado eventos de seguridad de alto nivel"

      - alert: UnusualAccessPattern
        expr: abs(requests_total - requests_total_offset_1d) / requests_total_offset_1d * 100 > 200
        for: 10m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Patrón de acceso inusual"
          description: "El patrón de acceso ha cambiado más del 200% respecto al día anterior"