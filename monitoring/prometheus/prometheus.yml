# Prometheus Configuration for Sistema Biométrico
# Monitoring and Metrics Collection

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'sistema-biometrico-monitor'
    environment: 'production'

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
          - localhost:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 30s
    metrics_path: /metrics

  # MySQL Exporter for database metrics
  - job_name: 'mysql-exporter'
    static_configs:
      - targets: ['localhost:9104']
    scrape_interval: 30s
    metrics_path: /metrics

  # Nginx Exporter for web server metrics
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['localhost:9113']
    scrape_interval: 30s
    metrics_path: /metrics

  # PHP-FPM Exporter for application metrics
  - job_name: 'php-fpm-exporter'
    static_configs:
      - targets: ['localhost:9253']
    scrape_interval: 30s
    metrics_path: /metrics

  # Redis Exporter for cache metrics
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 30s
    metrics_path: /metrics

  # Custom application metrics
  - job_name: 'sistema-biometrico'
    static_configs:
      - targets: ['localhost:8000']
    scrape_interval: 15s
    metrics_path: /metrics
    params:
      format: ['prometheus']

  # Custom business metrics
  - job_name: 'business-metrics'
    static_configs:
      - targets: ['localhost:8000']
    scrape_interval: 60s
    metrics_path: /api/metrics/business

# Remote write configuration (optional - for long-term storage)
# remote_write:
#   - url: "https://your-prometheus-remote-write-url.com/api/v1/write"
#     basic_auth:
#       username: your-username
#       password: your-password

# Storage configuration
storage:
  tsdb:
    path.data: /var/lib/prometheus/data
    path.wal: /var/lib/prometheus/wal
    retention.time: 30d
    retention.size: 10GB
    wal_compression: true