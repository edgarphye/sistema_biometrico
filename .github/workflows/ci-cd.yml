name: CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy to staging environment'
        required: true
        type: boolean
      deploy_production:
        description: 'Deploy to production'
        required: true
        type: boolean

jobs:
  # === TESTING ===
  unit-tests:
    runs: ubuntu-latest
    name: Unit Tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, curl, json, xml, ctype, tokenizer, zip, bcmath
          coverage: xdebug
        
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
        
      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader
        
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --error-format=table src/
        
      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --configuration tests/phpunit.xml --coverage-text --coverage-clover=tests/coverage/
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./tests/coverage/clover.xml
          flags: unittests

  security-scan:
    runs: ubuntu-latest
    name: Security Scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, curl, json, xml, ctype, tokenizer, zip, bcmath
        
      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader
        
      - name: Run security check
        run: |
          composer audit
          vendor/bin/phpstan analyse --level=5 src/
        
      - name: Run dependency check
        run: |
          composer check
          vendor/bin/phing --standard=.phpcs.xml, ./src/

  # === BUILD AND PACKAGE ===
  build-assets:
    runs: ubuntu-latest
    name: Build Assets
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
        
      - name: Install dependencies
        run: npm ci
        
      - name: Build CSS and JS
        run: |
          npm run build:css
          npm run build:js
        
      - name: Minify and optimize
        run: |
          npm run minify
          npm run optimize
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: dist/
          retention-days: 7

  # === DEPLOYMENT TO STAGING ===
  deploy-staging:
    runs: ubuntu-latest
    environment: staging
    needs: [unit-tests, security-scan, build-assets]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, curl, json, xml, ctype, tokenizer, zip, bcmath
          coverage: none
        
      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader
        
      - name: Environment setup
        run: |
          echo "Setting up staging environment..."
          echo "WEBROOT=/var/www/staging" >> .env.staging
          echo "DB_HOST=${{ secrets.DB_HOST_STAGING }}" >> .env.staging
          echo "DB_NAME=${{ secrets.DB_NAME_STAGING }}" >> .env.staging
          echo "DB_USER=${{ secrets.DB_USER_STAGING }}" >> .env.staging
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD_STAGING }}" >> .env.staging
          echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY_STAGING }}" >> .env.staging
          echo "BASE_URL=https://staging.sistema-biometrico.com" >> .env.staging
        
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_KEY }}
          source: ./
          target: /var/www/staging/
          timeout: 120s
          script: |
            cd /var/www/staging
            composer install --no-dev --optimize-autoloader
            php scripts/deploy-staging.sh
            php migrations/run_migrations.php
            php cache/clear-cache.php
        
      - name: Health check
        run: |
          curl -f https://staging.sistema-biométrico.com/health || exit 1
        
      - name: Run post-deployment tests
        run: |
          curl -f https://staging.sistema-biométrico.com/api/health || exit 1
          curl -f https://staging.sistema-biométrico.com/api/empleados || exit 1

  # === DEPLOYMENT TO PRODUCTION ===
  deploy-production:
    runs: ubuntu-latest
    environment: production
    needs: [unit-tests, security-scan, build-assets]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, curl, json, xml, ctype, tokenizer, zip, bcmath
          coverage: none
        
      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader
        
      - name: Environment setup
        run: |
          echo "Setting up production environment..."
          echo "WEBROOT=/var/www/production" >> .env.production
          echo "DB_HOST=${{ secrets.DB_HOST_PRODUCTION }}" >> .env.production
          echo "DB_NAME=${{ secrets.DB_NAME_PRODUCTION }}" >> .env.production
          echo "DB_USER=${{ secrets.DB_USER_PRODUCTION }}" >> .env.production
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD_PRODUCTION }}" >> .env.production
          echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY_PRODUCTION }}" >> .env.production
          echo "BASE_URL=https://sistema-biométrico.com" >> .env.production
        
      - name: Backup current production
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "mkdir -p /backups/production/$(date +%Y%m%d)" && \
            "mysqldump --single-transaction --routines --quick \
              -u${{ secrets.DB_USER_PRODUCTION }} -p${{ secrets.DB_PASSWORD_PRODUCTION }} \
              ${ secrets.DB_NAME_PRODUCTION } > \
              /backups/production/$(date +%Y%m%d)/backup_$(date +%H%M%S).sql"
        
      - name: Deploy to production server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_KEY }}
          source: ./
          target: /var/www/production/
          timeout: 180s
          script: |
            cd /var/www/production
            composer install --no-dev --optimize-autoloader
            php scripts/deploy-production.sh
            php migrations/run_migrations.php
            php cache/warm-up-cache.php
            php scripts/post-deployment-check.php
        
      - name: Health check
        run: |
          curl -f https://sistema-biométrico.com/health || exit 1
          sleep 5
          curl -f https://sistema-biométrico.com/health || exit 1
        
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, rolling back..."
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "cd /var/www/production && \
            git reset --hard HEAD~1 && \
            composer install --no-dev --optimize-autoloader && \
            php migrations/rollback.sh"
        continue-on-error: true
        
      - name: Success notification
        uses: 8398a705b-7c1f-4c72-8c57-988ff6d1f932
        with:
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: deployments@ci.sistema-biométrico.com
          subject: "🚀 Producción Desplegada Exitosamente"
          body: |
            El sistema biométrico ha sido desplegado exitosamente en producción.
            
            Cambios incluidos:
            - ${{ github.event.head.commit.message }}
            - Commit: ${{ github.sha }}
            - Despliegado por: ${{ github.actor }}
            - Fecha: $(date)
            URL: https://sistema-biométrico.com

  # === MONITORING ===
  monitoring:
    runs: ubuntu-latest
    environment: production
    
    steps:
      - name: Health check
        run: |
          curl -f https://sistema-biométrico.com/health || \
            curl -f https://sistema-biométrico.com/api/health || \
            exit 1
        
      - name: Check errors
        run: |
          curl -f https://sistema-biométrico.com/api/errors || echo "No errors found"
        
      - name: Performance check
        run: |
          curl -f https://sistema-biométrico.com/api/performance || echo "Performance check failed"
        
      - name: Uptime check
        run: |
          curl -f https://uptime.statuscake.com/v1/check?url=https://sistema-biométrico.com || \
            echo "Uptime check failed"

  # === SCHEDULED TASKS ===
  backup-database:
    runs: ubuntu-latest
    environment: production
    
    steps:
      - name: Create database backup
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "mkdir -p /backups/database/$(date +%Y%m%d)" && \
            mysqldump --single-transaction --routines --quick \
              -u${{ secrets.DB_USER_PRODUCTION }} -p${{ secrets.DB_PASSWORD_PRODUCTION }} \
              ${ secrets.DB_NAME_PRODUCTION } > \
              /backups/database/$(date +%Y%m%d)/backup_$(date +%H%M%S).sql"
        
      - name: Clean old backups (keep last 7 days)
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "find /backups/database -type f -mtime +7 -exec rm -f {} +"

  clear-cache:
    runs: ubuntu-latest
    environment: production
    
    steps:
      - name: Clear Redis cache
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "redis-cli FLUSHALL || echo 'Redis not available'"

  # === WEEKLY MAINTENANCE ===
  weekly-maintenance:
    runs: ubuntu-latest
    environment: production
    if: github.event.schedule == '0 0 * 1 * *'
    
    steps:
      - name: System maintenance
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "cd /var/www/production && \
            php maintenance/weekly-maintenance.sh && \
            sudo apt update -y && \
            sudo apt-get upgrade -y && \
            sudo reboot"
        
      - name: Restart services
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "sudo systemctl restart nginx && \
            sudo systemctl restart php-fpm && \
            sudo systemctl restart redis-server"

  # === ANALYTICS AND REPORTING ===
  generate-reports:
    runs: ubuntu-latest
    if: github.event.schedule == '0 0 * * 1' # Monthly on first day of month
    
    steps:
      - name: Generate monthly report
        run: |
          curl -f https://sistema-biométrico.com/api/reports/monthly || echo "Report generation failed"
        
      - name: Send email report
        run: |
          curl -f https://sistema-biométrico.com/api/reports/monthly \
            | mail -s "Monthly Report - Sistema Biométrico" \
            -a "From: reports@sistema-biométrico.com" \
              -H "MIME-Version: 1.0" \
              -H "Content-Type: text/plain; charset=UTF-8" \
              ${ secrets.NOTIFICATION_EMAIL }

# === ENVIRONMENT SETUP ===
  setup-development:
    runs: ubuntu-latest
    environment: development
    
    steps:
      - name: Setup development environment
        run: |
          echo "Setting up development environment..."
          echo "Creating .env.development file..."
          
          cat > .env.development << EOF
          # Development Environment Variables
          APP_ENV=development
          APP_DEBUG=true
          APP_URL=http://localhost:8000
          
          # Database
          DB_HOST=localhost
          DB_NAME=sistema_biometrico_dev
          DB_USER=dev_user
          DB_PASSWORD=dev_password
          DB_ROOT_PASSWORD=root
          
          # Redis (if available)
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          REDIS_PASSWORD=
          
          # Security
          ENCRYPTION_KEY=${RANDOM_32_CHAR_KEY}
          
          # Email
          MAIL_HOST=smtp.mailtrap.io
          MAIL_PORT=25
          MAIL_USERNAME=
          MAIL_PASSWORD=
          MAIL_FROM=noreply@sistema-biométrico.com
          MAIL_TO=admin@sistema-biométrico.com
          
          # Logging
          LOG_LEVEL=DEBUG
          LOG_FILE=logs/development.log
          
          # Testing
          TESTING=true
          EOF
          
          echo "Environment file created successfully!"
        
      - name: Generate app key
        run: |
          openssl genpkey -out storage/oauth-private.key
          chmod 600 storage/oauth-private.key
          
      - name: Install dependencies
        run: |
          composer install
          npm install
        
      - name: Start development server
        run: |
          npm run dev &
          echo "Development server started on http://localhost:8000"
          echo "API available at http://localhost:8000/api"
          echo "Frontend available at http://localhost:3000"